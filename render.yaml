services:
  - type: web
    name: terabox-telegram-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: XAPIVERSE_API_URL
        value: https://xapiverse.com/api/terabox-pro
      - key: XAPIVERSE_KEY
        sync: false
      - key: TEMP_DIR
        value: ./temp
      - key: DEFAULT_QUALITY
        value: 480p
      - key: REQUEST_TIMEOUT
        value: 45
      - key: FFMPEG_BIN
        value: ffmpeg
      - key: PORT
        value: 8080
      - key: KEEP_ALIVE_URL
        sync: false
      - key: KEEP_ALIVE_INTERVAL
        value: 300
